# This configuration is used by both Qlty CLI and Qlty Cloud.
config_version = "0"

exclude_patterns = [
  "*_min.*",
  "*-min.*",
  "*.min.*",
  "**/.yarn/**",
  "**/*.d.ts",
  "**/assets/**",
  "**/bower_components/**",
  "**/build/**",
  "**/cache/**",
  "**/config/**",
  "**/db/**",
  "**/deps/**",
  "**/dist/**",
  "**/extern/**",
  "**/external/**",
  "**/generated/**",
  "**/Godeps/**",
  "**/gradlew/**",
  "**/mvnw/**",
  "**/node_modules/**",
  "**/protos/**",
  "**/seed/**",
  "**/target/**",
  "**/templates/**",
  "**/testdata/**",
  "**/vendor/**",
]

test_patterns = [
  "**/test/**",
  "**/spec/**",
  "**/*.test.*",
  "**/*.spec.*",
  "**/*_test.*",
  "**/*_spec.*",
  "**/test_*.*",
  "**/spec_*.*",
]

[smells]
mode = "comment"

[[source]]
name = "default"
default = true

[[plugin]]
name = "actionlint"

[[plugin]]
name = "eslint"
package_file = "package.json"
package_filters = ["eslint", "prettier"]

[[plugin]]
name = "osv-scanner"

[[plugin]]
name = "prettier"
package_file = "package.json"
package_filters = ["prettier"]

[[plugin]]
name = "ripgrep"
mode = "comment"

[[plugin]]
name = "trufflehog"

[[plugin]]
name = "zizmor"

# Qlty invokes formatters with explicit paths, so mirror the files that the
# repository's Prettier command intentionally leaves to their owning tools.
[[exclude]]
plugins = ["prettier"]
file_patterns = ["pnpm-lock.yaml", "public/**", "BACKUP_CONTENT.md"]
